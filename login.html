<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>EduManage Portal - Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        .hero-section {
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(13, 30, 60, 0.4) 0%, rgba(13, 30, 60, 0.9) 100%);
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background-color: #2563eb;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .role-btn {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            color: #6b7280;
            background: white;
            transition: all 0.2s;
        }
        .role-btn:hover { border-color: #2563eb; color: #2563eb; }
        .role-btn.active {
            background-color: #eff6ff;
            border-color: #2563eb;
            color: #2563eb;
        }

        .input-group { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .input-group:focus-within { border-color: #2563eb; box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.1); }
        .input-group-text { background-color: transparent; border: none; color: #6b7280; }
        .form-control { border: none; font-size: 0.95rem; }
        .form-control:focus { box-shadow: none; background-color: transparent; }
        
        .btn-primary { background-color: #2563eb; border: none; border-radius: 8px; }
        .btn-primary:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container-fluid p-0 vh-100">
        <div class="row g-0 h-100">
            
            <div class="col-lg-6 d-none d-lg-block hero-section">
                <div class="hero-overlay"></div>
                <div class="position-absolute bottom-0 start-0 p-5 text-white w-100">
                    <h1 class="fw-bold mb-2" style="font-size: 2.5rem;">Welcome to EduManage</h1>
                    <p class="fs-5 text-light opacity-75" style="max-width: 80%;">
                        Integrated academic management system for students and faculty.
                    </p>
                </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center justify-content-center">
                <div class="w-100 px-4" style="max-width: 460px;">
                    
                    <div class="text-center mb-4 pb-2">
                        <div class="brand-logo mb-3">
                            <i class="bi bi-mortarboard-fill text-white fs-1"></i>
                        </div>
                        <h4 class="fw-bold mb-1" style="color: #2563eb;">EduManage Portal</h4>
                        <p class="text-muted mb-0" style="font-size: 0.75rem; letter-spacing: 1px;">STUDENT MANAGEMENT SYSTEM</p>
                    </div>

                    <div id="alertBox" class="d-none small py-2 text-center rounded mb-3"></div>

                    <form id="loginForm">
                        
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-dark mb-2">User Role</label>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn role-btn active flex-fill d-flex flex-column align-items-center py-2">
                                    <i class="bi bi-person fs-5 mb-1"></i>
                                    <span style="font-size: 0.8rem; font-weight: 500;">Student</span>
                                </button>
                                <button type="button" class="btn role-btn flex-fill d-flex flex-column align-items-center py-2">
                                    <i class="bi bi-person-video3 fs-5 mb-1"></i>
                                    <span style="font-size: 0.8rem; font-weight: 500;">Faculty</span>
                                </button>
                                <button type="button" class="btn role-btn flex-fill d-flex flex-column align-items-center py-2">
                                    <i class="bi bi-shield-lock fs-5 mb-1"></i>
                                    <span style="font-size: 0.8rem; font-weight: 500;">Admin</span>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-dark mb-1">Identification (ID)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" id="identification" class="form-control ps-0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-dark mb-0">Password</label>
                                <a href="#" id="forgotPasswordBtn" class="text-decoration-none small" style="color: #2563eb; font-weight: 500;">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control px-0" required>
                                <span class="input-group-text" style="cursor: pointer;"><i class="bi bi-eye"></i></span>
                            </div>
                        </div>

                        <div class="form-check mb-4 mt-2">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mb-4 d-flex justify-content-center align-items-center">
                            Sign In <i class="bi bi-arrow-right-short fs-5 ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">
                            Need help? Contact <a href="#" class="text-decoration-none" style="color: #2563eb;">IT Support Department</a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Xử lý chuyển đổi User Role (UI Only)
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        const alertBox = document.getElementById('alertBox');
        const identificationInput = document.getElementById('identification');

        // Hàm tiện ích để hiển thị thông báo
        function showAlert(message, type) {
            alertBox.className = `alert alert-${type} small py-2 text-center rounded mb-3`;
            alertBox.textContent = message;
            alertBox.classList.remove('d-none');
        }

        // Xử lý Submit Form gọi API Đăng nhập C++
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identification = identificationInput.value; 
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
            btn.disabled = true;
            alertBox.classList.add('d-none');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identification, password: password })
                });

                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem("user_id", result.user_id); 
                    window.location.href = result.redirect;
                } else {
                    showAlert("Sai tài khoản hoặc mật khẩu!", "danger");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert("Không thể kết nối đến máy chủ C++.", "danger");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // --- PHẦN MỚI TỔNG HỢP: Xử lý sự kiện Quên mật khẩu ---
        document.getElementById('forgotPasswordBtn').addEventListener('click', async function(e) {
            e.preventDefault(); 
            alertBox.classList.add('d-none');

            const identification = identificationInput.value;

            if (!identification) {
                showAlert("Vui lòng nhập Identification (ID) vào ô trống bên dưới để khôi phục mật khẩu.", "warning");
                identificationInput.focus();
                return;
            }

            try {
                // Gọi API C++ xử lý quên mật khẩu
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identification })
                });

                if (response.ok) {
                    showAlert("Hướng dẫn khôi phục đã được gửi đến tài khoản của bạn.", "success");
                } else {
                    showAlert("Không tìm thấy tài khoản trong hệ thống.", "danger");
                }
            } catch (error) {
                showAlert("Không thể kết nối đến máy chủ C++.", "danger");
            }
        });
    </script>
</body>
</html>
